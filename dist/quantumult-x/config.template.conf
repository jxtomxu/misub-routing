# 模板：在本地添加 MiSub 订阅和私有例外；不可把凭据上传 GitHub。
[general]
server_check_url = https://www.gstatic.com/generate_204
[dns]
no-ipv6
server = 1.1.1.1
server = 9.9.9.9
doh-server = https://1.1.1.1/dns-query
server = /bilibili.com/223.5.5.5
[policy]
static = Proxy, reject, direct, resource-tag-regex=^MiSub$
static = Intelligence, Proxy, direct, resource-tag-regex=^MiSub$
static = Telegram, Proxy, direct, resource-tag-regex=^MiSub$
static = YouTube, Proxy, direct, resource-tag-regex=^MiSub$
static = Google, Proxy, direct, resource-tag-regex=^MiSub$
static = BiliBili, direct, Proxy, resource-tag-regex=^MiSub$
static = GlobalMedia, Proxy, direct, resource-tag-regex=^MiSub$
static = Emby, direct, Proxy, resource-tag-regex=^MiSub$
[server_remote]
# 在此处添加本地 MiSub URL，tag=MiSub, update-interval=3600
