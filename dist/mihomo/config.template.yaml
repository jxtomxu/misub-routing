# 模板：须通过本地覆写提供 LOCAL_SNELL、LOCAL_STATIC 和 MiSub URL。
mixed-port: 7890
allow-lan: false
mode: rule
ipv6: false
proxy-providers:
  MiSub:
    type: http
    url: https://example.invalid/LOCAL_MISUB_URL
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxies: []
proxy-groups:
- name: Proxy
  type: select
  proxies:
  - REJECT
  - DIRECT
  - LOCAL_SNELL
  - LOCAL_STATIC
  use:
  - MiSub
- name: Intelligence
  type: select
  proxies:
  - Proxy
  - DIRECT
  - LOCAL_SNELL
  - LOCAL_STATIC
  use:
  - MiSub
- name: Telegram
  type: select
  proxies:
  - Proxy
  - DIRECT
  - LOCAL_SNELL
  - LOCAL_STATIC
  use:
  - MiSub
- name: YouTube
  type: select
  proxies:
  - Proxy
  - DIRECT
  - LOCAL_SNELL
  - LOCAL_STATIC
  use:
  - MiSub
- name: Google
  type: select
  proxies:
  - Proxy
  - DIRECT
  - LOCAL_SNELL
  - LOCAL_STATIC
  use:
  - MiSub
- name: BiliBili
  type: select
  proxies:
  - DIRECT
  - Proxy
  - LOCAL_SNELL
  - LOCAL_STATIC
  use:
  - MiSub
- name: GlobalMedia
  type: select
  proxies:
  - Proxy
  - DIRECT
  - LOCAL_SNELL
  - LOCAL_STATIC
  use:
  - MiSub
- name: Emby
  type: select
  proxies:
  - DIRECT
  - Proxy
  - LOCAL_SNELL
  - LOCAL_STATIC
  use:
  - MiSub
dns:
  enable: true
  ipv6: false
  default-nameserver: &id001
  - 1.1.1.1
  - 9.9.9.9
  proxy-server-nameserver: *id001
  nameserver:
  - https://1.1.1.1/dns-query#LOCAL_SNELL
  nameserver-policy:
    rule-set:chinamax-dns:
    - 223.5.5.5
    - 223.6.6.6
    +.bilibili.com:
    - 223.5.5.5
tun:
  enable: false
  dns-hijack:
  - 8.8.8.8:53
  - 8.8.4.4:53
